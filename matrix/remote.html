<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="robots" content="noindex"><title>Deck Remote</title>
<style>
:root{--bg:#0B0D15;--fg:#E4E9F5;--mut:#8893AA;--lime:#B6FF3C;--amber:#FFB020;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:500 16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555;margin-right:6px}.dot.ok{background:var(--lime)}.dot.bad{background:#FF5A1F}
.ct{font-weight:800;font-size:15px;color:#fff}
.secs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.secs::-webkit-scrollbar{display:none}
.secs button{flex:0 0 auto;height:auto;padding:7px 11px;border-radius:999px;font-family:inherit;font-weight:700;font-size:12px;line-height:1;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.08);color:#A9B2C6;border:1px solid var(--line)}
.secs button.on{background:var(--lime);color:#0B0D15;border-color:var(--lime)}.secs button.done{color:#6F7A92}
.chap{display:flex;justify-content:space-between;align-items:baseline;color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.chap span{color:var(--mut);letter-spacing:.04em;text-transform:none;font-weight:600}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin:6px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime);width:0;transition:width .3s}
h1{font-size:25px;line-height:1.15;margin:2px 0 8px}
.nxt{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.04);margin-bottom:8px}.nxt small{display:block;color:var(--mut);font-weight:700;font-size:11px;line-height:1;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}.nxt b{font-size:16px;color:#fff}.nxt em{display:block;font-style:normal;color:var(--amber);font-size:12.5px;margin-top:3px;font-weight:700}
#notes{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:17px;line-height:1.45;color:#D2D9E8;background:rgba(255,255,255,.04);white-space:pre-wrap}
.row{display:flex;gap:12px;padding:10px 0 12px}
button{font-family:inherit;font-weight:800;font-size:26px;border:0;border-radius:18px;color:#0B0D15;background:var(--lime);padding:0;height:clamp(92px,15vh,140px);flex:2;touch-action:manipulation}
button.sec{flex:1;background:rgba(255,255,255,.12);color:#fff}button:active{transform:scale(.97);filter:brightness(.9)}
select{width:100%;background:#151826;color:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}
.mini{display:flex;gap:10px;align-items:center;padding:0 0 8px}.mini select{flex:1}.tm{font:700 15px ui-monospace,monospace;color:var(--mut);min-width:3.6em;text-align:right}
.err{padding:24px;text-align:center;color:var(--mut)}
</style></head><body>
<div id="app"><div class="err">Connecting…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
 var q=new URLSearchParams(location.search),code=(q.get('c')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 var app=document.getElementById('app');
 if(!code){app.innerHTML='<div class="err">Open this page from the REMOTE button on the laptop (it shows a QR code).</div>';return}
 app.outerHTML='<div class="top"><span><span class="dot" id="dot"></span><span id="st">Connecting…</span></span><span class="ct" id="ct"></span></div><div class="secs" id="secs"></div><div class="chap"><b id="chap"></b><span id="cpos"></span></div><div class="bar"><i id="cbar"></i></div><h1 id="ti">&nbsp;</h1><div class="nxt"><small>Next up</small><b id="nx"></b><em id="nxc"></em></div><div id="notes">Speaker notes show here.</div><div class="mini"><select id="jump" aria-label="Jump to a slide"><option>Jump to a slide…</option></select><span class="tm" id="tm" title="Tap to reset">0:00</span></div><div class="mini"><button class="sec" id="vb" style="height:48px;font-size:15px;flex:1">Voice: off</button><span class="tm" id="vh" style="font-size:12px;text-align:left;flex:1">say “next” or “back”</span></div><div class="row"><button class="sec" id="pv">&larr; Back</button><button id="nx2">Next &rarr;</button></div>';
 var $=function(i){return document.getElementById(i)},last=0;
 var sb=window.supabase.createClient('https://ladhdgwedwynmdmeeena.supabase.co','sb_publishable_YP3m7RX-lI7ycGk-36G-QQ_QoifyVHE');
 var ch=sb.channel('icda26-'+code,{config:{broadcast:{self:false}}});
 function send(p){ch.send({type:'broadcast',event:'cmd',payload:p});if(navigator.vibrate)navigator.vibrate(12)}
 var cur=-1,t0=0,started=false;
 function fmt(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
 ch.on('broadcast',{event:'state'},function(m){var s=m.payload;last=Date.now();
  $('ct').textContent=(s.idx+1)+' / '+s.total;$('ti').textContent=s.title||'';
  var cs=s.chaps||[],ci=-1;cs.forEach(function(c,n){if(s.idx>=c.at&&s.idx<c.at+c.n)ci=n});
  if(cs.length){var sh='';cs.forEach(function(c,n){sh+='<button data-at="'+c.at+'" class="'+(n===ci?'on':(n<ci?'done':''))+'">'+c.t.replace(/</g,'&lt;')+'</button>'});if($('secs').getAttribute('data-k')!==cs.length+'|'+ci){$('secs').innerHTML=sh;$('secs').setAttribute('data-k',cs.length+'|'+ci);var on=$('secs').querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}}
  var c0=cs[ci];if(c0){$('chap').textContent=c0.t;$('cpos').textContent='slide '+(s.idx-c0.at+1)+' of '+c0.n+' · section '+(ci+1)+' of '+cs.length;$('cbar').style.width=Math.round((s.idx-c0.at+1)/c0.n*100)+'%'}else{$('chap').textContent=s.chap||''}
  $('nx').textContent=s.next||'This is the last slide';
  var nc=(s.nextChap&&s.nextChap!==s.chap)?('Next section: '+s.nextChap):'';$('nxc').textContent=nc;$('nxc').style.display=nc?'block':'none';
  $('notes').textContent=s.notes||'(no notes on this slide)';$('notes').scrollTop=0;
  var j=$('jump');if(s.toc&&j.getAttribute('data-n')!==String(s.toc.length)){var g='',lc=null;s.toc.forEach(function(t){if(t.c!==lc){if(lc!==null)g+='</optgroup>';g+='<optgroup label="'+(t.c||'').replace(/"/g,'')+'">';lc=t.c}g+='<option value="'+t.i+'">'+(t.i+1)+'. '+t.t.replace(/</g,'&lt;')+'</option>'});g+='</optgroup>';j.innerHTML='<option value="">Jump to a slide…</option>'+g;j.setAttribute('data-n',String(s.toc.length))}
  if(j.value!==String(s.idx)&&!j.matches(':focus'))j.value=String(s.idx);
  if(cur!==-1&&s.idx!==cur&&!started){started=true;t0=Date.now()}cur=s.idx});
 $('secs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)send({a:'go',n:+b.getAttribute('data-at')})});
 $('tm').onclick=function(){started=false;t0=0;$('tm').textContent='0:00'};
 ch.subscribe(function(st){if(st==='SUBSCRIBED'){send({a:'hello'})}});
 $('nx2').onclick=function(){send({a:'next'})};$('pv').onclick=function(){send({a:'prev'})};
 $('jump').onchange=function(e){if(e.target.value!=='')send({a:'go',n:+e.target.value});e.target.blur()};
 setInterval(function(){var ok=Date.now()-last<7000;$('dot').className='dot '+(ok?'ok':'bad');$('st').textContent=ok?'Connected to the laptop':(last?'Laptop not responding':'Waiting for the laptop…');if(started){$('tm').textContent=fmt(Math.floor((Date.now()-t0)/1000))}if(!ok&&Date.now()%5000<1000)send({a:'hello'})},1000);
 document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')send({a:'next'});if(e.key==='ArrowLeft')send({a:'prev'})});

 var SR=window.SpeechRecognition||window.webkitSpeechRecognition,vOn=false,vRec=null,vLast=0;
 function vmatch(t){t=(t||'').toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(hey |ok |okay )?(quantum|deck|slides?) /,'');
  if(/^(next|next slide|next one|forward|advance|go next|go forward|continue)$/.test(t))return 'next';
  if(/^(back|go back|previous|previous slide|last slide|go previous|back one)$/.test(t))return 'prev';return ''}
 $('vb').onclick=function(){if(!SR){$('vh').textContent='Voice needs Chrome (Android) or Safari 14.1+';return}
  if(vOn){vOn=false;try{vRec.stop()}catch(x){}$('vb').textContent='Voice: off';$('vh').textContent='say \u201cnext\u201d or \u201cback\u201d';return}
  vRec=new SR();vRec.continuous=true;vRec.interimResults=false;vRec.lang='en-US';
  vRec.onresult=function(e){for(var k=e.resultIndex;k<e.results.length;k++){if(!e.results[k].isFinal)continue;var a=vmatch(e.results[k][0].transcript);if(a&&Date.now()-vLast>900){vLast=Date.now();send({a:a});$('vh').textContent='Heard: '+a}}};
  vRec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){vOn=false;$('vb').textContent='Voice: off';$('vh').textContent='Allow the microphone'}};
  vRec.onend=function(){if(vOn){try{vRec.start()}catch(x){}}};
  try{vRec.start();vOn=true;$('vb').textContent='Voice: ON';$('vh').textContent='listening'}catch(x){}};
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen')}catch(e){}
 document.addEventListener('visibilitychange',function(){if(!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request('screen')}catch(e){}send({a:'hello'})}});
})();
</script></body></html>
