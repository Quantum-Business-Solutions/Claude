<title>Praxera Migration Asset Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#F6F7F4;--surface:#fff;--sunk:#EEF0EA;--ink:#191B17;--body:#3A3F36;
--muted:#6E7369;--rule:#DDE0D8;--accent:#65A11B;--accent-soft:#EAF2DC;--ok:#3D5A80;
--ok-soft:#E4EAF2;--warn:#8A6300;--warn-soft:#F6EDD8;--bad:#9B3B31;--bad-soft:#F5E3E0;
--shadow:0 1px 2px rgba(25,27,23,.05),0 8px 24px -16px rgba(25,27,23,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#141613;--surface:#1C1F1B;
--sunk:#22261F;--ink:#E9EBE4;--body:#C3C8BB;--muted:#8B9184;--rule:#2F342B;--accent:#8CC63F;
--accent-soft:#25301A;--ok:#8FB4DC;--ok-soft:#1B2632;--warn:#D9A93F;--warn-soft:#2E2716;
--bad:#DE8378;--bad-soft:#331F1C;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{--paper:#141613;--surface:#1C1F1B;--sunk:#22261F;--ink:#E9EBE4;
--body:#C3C8BB;--muted:#8B9184;--rule:#2F342B;--accent:#8CC63F;--accent-soft:#25301A;
--ok:#8FB4DC;--ok-soft:#1B2632;--warn:#D9A93F;--warn-soft:#2E2716;--bad:#DE8378;--bad-soft:#331F1C;
--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--body);font-size:16px;line-height:1.6;
font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 26px 90px}
.measure{max-width:68ch}
h1,h2,h3{font-family:Newsreader,Georgia,serif;color:var(--ink);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,5vw,2.9rem);line-height:1.08;letter-spacing:-.015em}
h2{font-size:clamp(1.4rem,3vw,1.8rem);line-height:1.18;margin:0 0 .3rem}
h3{font-size:1.05rem;font-weight:600;line-height:1.3}
p{margin:0 0 1rem}
a{color:var(--accent);text-underline-offset:3px}
code{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:.85em;
background:var(--sunk);padding:1px 5px;border-radius:2px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.67rem;letter-spacing:.16em;
text-transform:uppercase;color:var(--muted);margin:0 0 .5rem}
header.top{background:var(--surface);border-bottom:1px solid var(--rule);margin-bottom:40px}
header.top .wrap{padding-top:38px;padding-bottom:30px}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.brandline span{font-family:"IBM Plex Mono",monospace;font-size:.69rem;letter-spacing:.15em;
text-transform:uppercase;color:var(--muted)}
.sub{font-size:1.04rem;margin-top:14px;max-width:62ch}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:1px;
background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-top:26px}
.metric{background:var(--surface);padding:14px 16px}
.metric b{display:block;font-family:Newsreader,serif;font-size:1.85rem;line-height:1;
color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.metric.good b{color:var(--accent)}.metric.bad b{color:var(--bad)}.metric.warn b{color:var(--warn)}
.metric small{display:block;margin-top:6px;font-size:.68rem;letter-spacing:.05em;
color:var(--muted);text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
section{margin-top:56px;scroll-margin-top:16px}
.shead{border-top:2px solid var(--ink);padding-top:13px;margin-bottom:18px}
.call{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);
border-radius:0 3px 3px 0;padding:18px 20px;margin:18px 0;box-shadow:var(--shadow)}
.call.bad{border-left-color:var(--bad)}.call.warn{border-left-color:var(--warn)}
.call.good{border-left-color:var(--ok)}
.call h3{margin-bottom:.4rem}.call p:last-child{margin-bottom:0}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;
letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:2px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}.c-acc{background:var(--accent-soft);color:var(--accent)}
.c-mute{background:var(--sunk);color:var(--muted)}
.tscroll{overflow-x:auto;border:1px solid var(--rule);border-radius:3px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;
color:var(--muted);text-align:left;font-weight:500;padding:10px 13px;border-bottom:1px solid var(--rule);
background:var(--sunk);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.nm{color:var(--ink);font-weight:500;min-width:180px}
ul.tight{margin:0 0 1rem;padding-left:1.15rem}ul.tight li{margin-bottom:.42rem}
.note{font-size:.82rem;color:var(--muted);font-style:italic;margin-top:10px}
.stack{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:15px 17px;box-shadow:var(--shadow)}
.card b{display:block;font-family:Newsreader,serif;font-size:1.6rem;color:var(--ink);line-height:1}
.card .lbl{font-family:"IBM Plex Mono",monospace;font-size:.65rem;letter-spacing:.1em;
text-transform:uppercase;color:var(--muted);margin-top:6px}
.card .st{margin-top:9px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
/* ---- section navigation ------------------------------------------------ */
.jump{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);
border-radius:3px;overflow:hidden;margin-top:4px}
.jump a{flex:1 1 auto;text-align:center;background:var(--surface);padding:9px 14px;
font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.1em;
text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap}
.jump a:hover,.jump a:focus-visible{background:var(--sunk);color:var(--ink)}

/* ---- table headings and filters ---------------------------------------- */
.tsub{display:flex;align-items:baseline;gap:9px;margin:34px 0 10px;
font-family:Newsreader,Georgia,serif;font-size:1.15rem;font-weight:500;color:var(--ink)}
.tct{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;letter-spacing:.09em;
color:var(--muted);background:var(--sunk);padding:2px 7px;border-radius:2px;
font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:9px}
.filters .srch{flex:0 1 210px;display:flex}
.filters input[type=search]{width:100%;font:inherit;font-size:.79rem;color:var(--ink);
background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:5px 9px}
.filters input[type=search]::placeholder{color:var(--muted)}
button.f{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.65rem;letter-spacing:.08em;
text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--rule);
border-radius:2px;padding:5px 10px;cursor:pointer}
button.f:hover{color:var(--ink);background:var(--sunk)}
button.f[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);
border-color:var(--accent)}
:is(button.f,input[type=search],.jump a):focus-visible{outline:2px solid var(--accent);
outline-offset:2px}
.filters .count{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,monospace;
font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- numbered sequence ------------------------------------------------- */
ol.steps{counter-reset:s;list-style:none;margin:0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding-left:2.3rem;margin-bottom:.7rem}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.15em;
font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.66rem;color:var(--muted);
background:var(--sunk);border-radius:2px;padding:2px 6px;font-variant-numeric:tabular-nums}

td .chip+.chip{margin-left:4px}
td.ev{max-width:38ch}
</style>
<style>
/* Card body copy is read, not glanced at, so it drops the .note italic. */
.card p{font-size:.82rem;color:var(--muted);font-style:normal;margin:9px 0 0;line-height:1.5}
</style>
