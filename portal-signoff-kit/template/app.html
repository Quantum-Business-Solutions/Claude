<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#0F1B2D;--body:#33415C;--muted:#6B7A90;--line:#E2E8F0;--line2:#CBD5E1;--brand:#1D4ED8;--brand-soft:#E8EEFD;--ok:#15803D;--ok-soft:#E3F5EA;--warn:#B45309;--warn-soft:#FEF3DC;--bad:#B91C1C;--bad-soft:#FDE8E8;--shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.06)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#121B2E;--ink:#EAF0FB;--body:#B8C4D9;--muted:#8394AE;--line:#22304A;--line2:#2F4163;--brand:#7AA2FF;--brand-soft:#17274D;--ok:#4ADE80;--ok-soft:#10321F;--warn:#FBBF24;--warn-soft:#3A2B0A;--bad:#F87171;--bad-soft:#3A1414;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 80px}
.hero{padding:44px 0 24px}
.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:600}
h1{font:600 34px/1.15 Fraunces,Georgia,serif;color:var(--ink);margin:10px 0 10px;letter-spacing:-.01em}
.lead{max-width:680px;color:var(--body);font-size:16px;margin:0}
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -20px;padding:14px 20px}
.prog{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line)}
.prog i{display:block;height:100%;transition:width .35s}.p-ok{background:var(--ok)}.p-ed{background:var(--warn)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 12px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:600}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);background:var(--card);color:var(--body);padding:6px 13px;border-radius:99px;font:500 13px Inter;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:180px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:10px;font:14px Inter}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;font:500 13px Inter;cursor:pointer}
.btn:hover{border-color:var(--brand)}
.save{font-size:12px;color:var(--muted);margin-left:auto}.save.err{color:var(--bad)}.save.on{color:var(--ok)}
.card,.sub{scroll-margin-top:210px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin:16px 0}
.card>summary,.hd{list-style:none;flex-wrap:wrap;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 20px}
.card>summary::-webkit-details-marker{display:none}
.num{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:600 13px Inter;flex:none}
.ttl{flex:1;min-width:0}.ttl h3{margin:0;font:600 16px/1.3 Inter;color:var(--ink)}
.ttl small{color:var(--muted);font-size:12.5px}.ttl small.u{word-break:break-all}
.tag{font:600 11px Inter;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok)}.t-ed{background:var(--warn-soft);color:var(--warn)}.t-pn{background:var(--line);color:var(--muted)}.t-cf{background:var(--warn-soft);color:var(--warn)}.t-fr{background:var(--bad-soft);color:var(--bad)}
.chev{transition:transform .2s;color:var(--muted)}details[open]>summary .chev{transform:rotate(90deg)}
.body{padding:4px 20px 20px;border-top:1px solid var(--line)}
.fresh{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:13px;margin:14px 0 0}
.faq{margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
.faq.mod{border-color:var(--warn)}
.fq{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:600 15px/1.4 Inter;padding:6px 8px;border-radius:8px;resize:none;overflow:hidden}
.fa{width:100%;border:1px solid transparent;background:transparent;color:var(--body);font:15px/1.55 Inter;padding:6px 8px;border-radius:8px;resize:none;overflow:hidden;margin-top:2px}
.fq:hover,.fa:hover{border-color:var(--line2)}.fq:focus,.fa:focus{outline:none;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 3px var(--brand-soft)}
.lab{font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 8px}
.cf{margin:8px 8px 0;font-size:13px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:7px 11px}
.rv{font-size:12px;color:var(--brand);background:none;border:0;cursor:pointer;padding:4px 8px}
.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.ab{border:0;border-radius:10px;padding:10px 18px;font:600 14px Inter;cursor:pointer}
.ab-ok{background:var(--ok);color:#fff}.ab-ed{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.ab.off{background:var(--card);color:var(--muted);border:1px solid var(--line2)}
.who{font-size:12.5px;color:var(--muted)}
.cm{width:100%;margin-top:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px Inter;min-height:44px;resize:vertical}
.cl{margin:10px 0 0;font-size:13px}.cl div{padding:7px 11px;background:var(--brand-soft);border-radius:9px;margin-top:6px;color:var(--ink)}.cl span{color:var(--muted);font-size:11.5px}
.sec{margin:34px 0 4px;font:600 22px Fraunces,serif;color:var(--ink)}.sec small{font:14px Inter;color:var(--muted);margin-left:8px}
.qrow{padding:14px 20px;border-top:1px solid var(--line)}.qrow:first-of-type{border-top:0}
.qrow p{margin:0 0 8px;color:var(--ink)}.qrow p b{color:var(--brand)}
.qa{width:100%;border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px Inter;min-height:42px;resize:vertical}
.qg{padding:10px 20px 0;font:600 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.foot{margin-top:40px;font-size:12.5px;color:var(--muted);text-align:center}
button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 22px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.step.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.step.done{border-color:var(--ok)}
.step b{display:block;color:var(--ink);font:600 14px Inter}.step span{font-size:13px;color:var(--muted)}
.step i{font:600 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-style:normal}
.step.done i{color:var(--ok)}
.t-sk{background:var(--line);color:var(--body)}
.p-sk{background:var(--line2)}
.cfa{display:block;width:calc(100% - 0px);margin-top:6px;border:1px solid var(--warn);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font:14px Inter}
.cf{padding:9px 12px}
.sub{margin:30px 0;padding:22px;border:2px solid var(--brand);border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.sub h2{margin:0 0 6px;font:600 20px Fraunces,serif;color:var(--ink)}
.sub.sent{border-color:var(--ok)}
.ab-go{background:var(--brand);color:#fff}
.ab-sk{background:var(--card);color:var(--body);border:1px solid var(--line2)}
.nx{margin-left:auto}
@media(max-width:700px),(max-height:720px){.bar{position:static}.card,.sub{scroll-margin-top:12px}}
@media(max-width:600px){h1{font-size:27px}.hd,.card>summary{padding:14px;flex-wrap:wrap}.card>summary .ttl{flex:1 1 calc(100% - 50px)}.card>summary .tag{margin-left:44px}.chev{margin-left:auto}.body{padding:2px 14px 16px}.steps{grid-template-columns:1fr}.ab{padding:12px 16px;flex:1 1 auto}.nx{margin-left:0}.stats span:last-child{display:none}.search{min-width:100%}}
@media print{.bar,.act,.cm,.rv{display:none}.card{box-shadow:none;break-inside:avoid}details{display:block}}
</style>
<div id="root"></div>
