<style>@font-face{font-family:Anton;src:url(../assets/anton-latin-400-normal.woff2)}@font-face{font-family:'DM Sans';font-weight:400;src:url(../assets/dm-sans-latin-400-normal.woff2)}@font-face{font-family:'DM Sans';font-weight:700;src:url(../assets/dm-sans-latin-700-normal.woff2)}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'DM Sans',sans-serif;color:#0F1320}
.stage{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 40%,#1A2233,#06070C)}
.win{position:absolute;left:170px;top:110px;width:1580px;height:860px;background:#F6F7FA;border-radius:22px;box-shadow:0 60px 140px -30px rgba(0,0,0,.8);overflow:hidden}

.side{background:#fff;border-right:1px solid #E4E7EE;padding:34px}

.act .t{font-size:22px;margin-top:10px;line-height:1.45;color:#33475B}
.tick{color:#00BDA5;font-weight:700}
.cas{position:absolute;inset:0;background:#F4F6FA;font-family:Inter,'DM Sans',sans-serif;color:#1B2433}
.win .cas{position:absolute;inset:0}
