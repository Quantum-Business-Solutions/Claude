<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:Anton;src:url(../assets/anton-latin-400-normal.woff2)}@font-face{font-family:'DM Sans';font-weight:400;src:url(../assets/dm-sans-latin-400-normal.woff2)}@font-face{font-family:'DM Sans';font-weight:700;src:url(../assets/dm-sans-latin-700-normal.woff2)}</style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:'DM Sans',sans-serif;color:#0F1320}
.stage{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 40%,#1A2233,#06070C)}
.win{position:absolute;left:170px;top:110px;width:1580px;height:860px;background:#F6F7FA;border-radius:22px;box-shadow:0 60px 140px -30px rgba(0,0,0,.8);overflow:hidden}
.top{height:88px;background:#fff;border-bottom:1px solid #E4E7EE;display:flex;align-items:center;justify-content:space-between;padding:0 38px}
.top img{display:block}
.sync{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;color:#33475B}
.sync .dot{width:12px;height:12px;border-radius:50%;background:#00BDA5}
.body{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;padding:38px}
.card{background:#fff;border:1px solid #E4E7EE;border-radius:18px;padding:30px 34px}
.lbl{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#7C8599}
.big{font-family:'Anton',sans-serif;font-size:190px;line-height:1;color:#E0312B;margin-top:8px}
.sub{display:flex;gap:40px;margin-top:22px}
.sub b{display:block;white-space:nowrap;font-family:'Anton',sans-serif;font-size:58px;color:#0F1320;line-height:1.05}
.sub span{font-size:16px;color:#7C8599;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;padding:17px 4px;border-bottom:1px solid #EEF0F4;font-size:22px}
.row .who b{display:block;font-size:22px}.row .who span{font-size:17px;color:#7C8599}
.pill{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border-radius:99px}
.live{background:#E6F7EA;color:#138A36}.skip{background:#F1F2F5;color:#8A93A6}.book{background:#FFF1E6;color:#C4560A}
.hs{display:flex;align-items:center;gap:14px;margin-top:22px;padding:18px 22px;border-radius:14px;background:#FFF5F0;border:1px solid #FFD9C7;font-size:21px;font-weight:700;color:#33475B}
.hide{opacity:0}

.rec{display:grid;grid-template-columns:380px 1fr;height:772px}
.side{background:#fff;border-right:1px solid #E4E7EE;padding:34px}
.av{width:96px;height:96px;border-radius:50%;background:#FF7A59;color:#fff;font:700 38px 'DM Sans';display:flex;align-items:center;justify-content:center}
.side h3{font-size:30px;margin-top:18px}.side p{font-size:19px;color:#516F90;margin-top:6px}
.prop{margin-top:22px;font-size:16px;color:#7C8599;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.prop b{display:block;font-size:20px;color:#33475B;text-transform:none;letter-spacing:0;margin-top:4px}
.feed{padding:30px 36px;background:#F5F8FA}
.act{background:#fff;border:1px solid #DFE3EB;border-radius:14px;padding:22px 26px;margin-bottom:18px;transition:all .4s}
.act .h{display:flex;justify-content:space-between;font-size:17px;font-weight:700;color:#516F90;text-transform:uppercase;letter-spacing:.08em}
.act .t{font-size:22px;margin-top:10px;line-height:1.45;color:#33475B}
.tick{color:#00BDA5;font-weight:700}
.cas{position:absolute;inset:0;background:#F4F6FA;font-family:Inter,'DM Sans',sans-serif;color:#1B2433}
.win .cas{position:absolute;inset:0}
.cnav{height:78px;background:#fff;border-bottom:1px solid #E3E7EE;display:flex;align-items:center;gap:40px;padding:0 34px}
.ctabs{display:flex;gap:30px;font-size:19px;color:#4A5568;font-weight:700}.ctabs .on{color:#1A5FD0;border-bottom:3px solid #1A5FD0;padding-bottom:6px}
.cright{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:17px;font-weight:700}
.cok{background:#E7F6EC;color:#13803A;padding:8px 14px;border-radius:99px}
.cdt{background:#E7F6EC;color:#13803A;padding:8px 14px;border-radius:10px}.cdt b{font-size:20px;margin-left:6px}
.cbody{display:grid;grid-template-columns:420px 1fr 560px;gap:24px;padding:26px}
.cbody>div{background:#fff;border:1px solid #E3E7EE;border-radius:14px;padding:24px;height:920px;overflow:hidden}
.win .cbody>div{height:700px}
.cconn{display:inline-block;background:#1E9E4A;color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;padding:7px 12px;border-radius:8px}
.cname{font-size:32px;font-weight:700;margin-top:16px}.crole{font-size:18px;color:#5B6678;margin-top:6px}
.cfield{border-top:1px solid #EEF1F5;margin-top:18px;padding-top:14px}.cfield span{display:block;font-size:14px;color:#7A8597;font-weight:700}.cfield b{display:block;font-size:19px;margin-top:4px}
.chd{font-size:21px;font-weight:700;margin-bottom:16px}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.ctiles div{border-left:4px solid #1A5FD0;padding:6px 14px}.ctiles div:nth-child(2){border-color:#1E9E4A}.ctiles div:nth-child(3){border-color:#D93A3A}
.ctiles span{display:block;font-size:15px;color:#5B6678;font-weight:700}.ctiles b{font-size:64px;line-height:1.1}
.clb{display:grid;grid-template-columns:60px 1fr 190px 130px;padding:14px 6px;border-bottom:1px solid #EEF1F5;font-size:18px}.crk{font-weight:700;color:#1A5FD0}.cu{font-weight:700}
.cl{display:flex;gap:12px;margin-bottom:14px}.ca{flex:0 0 34px;height:34px;border-radius:50%;background:#EEF1F5;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#5B6678}
.cl b{font-size:16px}.cl p{font-size:18px;line-height:1.4;margin-top:2px}
.csum{background:#EEF4FF;border:1px solid #CFE0FF;border-radius:12px;padding:16px 18px;margin-top:10px}.cst{font-weight:700;color:#1A5FD0;font-size:16px;margin-bottom:6px}.csum p{font-size:18px;line-height:1.45}
</style></head><body>

<script>
