<text x="82" y="463" font-size="12" fill="#444">Contacts · Pipeline and deals with company associations and stages · Carrier accounts with custom properties · Product library · Event-origin sourcing · Portal-wide domain backfill</text>
<text x="82" y="483" font-size="12" font-style="italic" fill="#8A6D18">Deal data routed to the sales owner for review before final import. Training deliberately held until migration completed, so the team trained on their own live records.</text>

