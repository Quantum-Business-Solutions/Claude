<path d="M735,706 L735,722" stroke="#B0642E" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ao)"/>

<!-- HubSpot to Salesforce -->
<path d="M900,315 L1020,315 L1020,246 L1150,246" fill="none" stroke="#00A1E0" stroke-width="2" marker-end="url(#ab)"/>
<text x="930" y="308" font-size="11" fill="#333">Qualified lead + HubSpot Summary field</text>
<path d="M900,352 L1060,352 L1060,333 L1150,333" fill="none" stroke="#00A1E0" stroke-width="2" marker-end="url(#ab)" marker-start="url(#abr)"/>
<text x="930" y="372" font-size="11" fill="#333">Contact sync — bidirectional, selective</text>
<path d="M900,588 L1020,588 L1020,531 L1150,531" fill="none" stroke="#00A1E0" stroke-width="2" marker-end="url(#ab)"/>
