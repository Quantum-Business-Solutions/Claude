<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1010" viewBox="0 0 1640 1010" font-family="Helvetica, Arial, sans-serif">
<rect width="1640" height="1010" fill="#ffffff"/>
<text x="40" y="42" font-size="25" font-weight="bold" fill="#1a1a1a">PacTec — ZoomInfo / HubSpot / Salesforce Data Flow</text>
<text x="40" y="68" font-size="14" fill="#555">Delivered by Quantum Business Solutions, May–September 2026. Salesforce remains the system of record.</text>

