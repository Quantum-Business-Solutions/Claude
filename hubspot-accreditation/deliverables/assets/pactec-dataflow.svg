<path d="M1150,642 L1100,642 L1100,782 L900,782" fill="none" stroke="#00A1E0" stroke-width="2" marker-end="url(#ab)"/>
<text x="930" y="805" font-size="11" fill="#333">Activity history restored, plus historical backfill</text>

<!-- notes -->
<rect x="40" y="855" width="700" height="105" rx="8" fill="#FFF9E6" stroke="#D9A441"/>
<text x="58" y="882" font-size="12.5" font-weight="bold" fill="#1a1a1a">Key design decision — the HubSpot Summary field</text>
<text x="58" y="903" font-size="11.5" fill="#444">Rather than replicating 423 intent properties into Salesforce, QBS built a single condensed</text>
<text x="58" y="921" font-size="11.5" fill="#444">custom field carrying the intent narrative into the Salesforce record where the seller works.</text>
<text x="58" y="939" font-size="11.5" fill="#444">Field sprawl traded for usable context.</text>
<rect x="780" y="855" width="700" height="105" rx="8" fill="#EDF7ED" stroke="#4C9A4C"/>
<text x="798" y="882" font-size="12.5" font-weight="bold" fill="#1a1a1a">Remediation delivered</text>
<text x="798" y="903" font-size="11.5" fill="#444">Salesforce activity sync had been dead since 5 February 2026 — root-caused and restored.</text>
<text x="798" y="921" font-size="11.5" fill="#444">Deal sync had never been configured — wired for the first time. 14 missing standard</text>
<text x="798" y="939" font-size="11.5" fill="#444">Salesforce integration properties gap-filled.</text>
</svg>
