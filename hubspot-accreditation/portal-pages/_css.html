<style>
:root{--navy:#0A1F44;--gold:#C9A227;--grey:#5A6470;--light:#F4F5F7;--border:#D8DDE3;--ink:#1A1A1A;--red:#8B1E1E;--green:#2F6B4F}
*{box-sizing:border-box}
.qbs{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.62;font-size:15px;max-width:1080px;margin:0 auto;padding:0 4px}
.qbs h1,.qbs h2,.qbs h3{line-height:1.25;margin:0}
.hero{background:linear-gradient(135deg,#0A1F44 0%,#15305e 100%);color:#fff;padding:38px 40px;border-radius:14px;margin-bottom:26px}
.hero .tag{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:12px}
.hero h1{font-size:31px;font-weight:750;letter-spacing:-.02em;margin-bottom:10px}
.hero .sub{font-size:15.5px;color:#C6D0E0;font-weight:400}
.hero .meta{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);display:flex;flex-wrap:wrap;gap:26px}
.hero .meta div{font-size:12.5px;color:#9FB0C9}
.hero .meta b{display:block;font-size:15px;color:#fff;font-weight:650;margin-top:3px}
h2.sec{font-size:21px;color:var(--navy);font-weight:700;margin:38px 0 6px;letter-spacing:-.01em}
h2.sec+.rule{height:3px;width:52px;background:var(--gold);border-radius:2px;margin-bottom:16px}
h3.sub{font-size:16px;color:#2E4057;font-weight:680;margin:24px 0 8px}
p{margin:0 0 13px}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 6px}
.stat{flex:1 1 150px;background:var(--light);border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:9px;padding:15px 17px}
.stat .n{font-size:25px;font-weight:750;color:var(--navy);letter-spacing:-.02em;line-height:1.15}
.stat .l{font-size:12px;color:var(--grey);margin-top:5px;line-height:1.4}
table{width:100%;border-collapse:collapse;margin:14px 0 18px;font-size:14px}
th{background:var(--navy);color:#fff;text-align:left;padding:10px 13px;font-weight:640;font-size:13px}
td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:top}
tr:nth-child(even) td{background:#FAFBFC}
td.k{font-weight:640;color:var(--navy);width:30%;background:var(--light)!important}
.box{border-radius:10px;padding:16px 20px;margin:18px 0;border:1px solid;border-left-width:5px}
.box .t{font-weight:700;font-size:14px;margin-bottom:6px}
.box p{font-size:14px;margin:0 0 7px}.box p:last-child{margin:0}
.ok{background:#EDF5F0;border-color:var(--green)}.ok .t{color:var(--green)}
.gap{background:#FDF6E3;border-color:var(--gold)}.gap .t{color:#8A6D18}
.risk{background:#FBEEEE;border-color:var(--red)}.risk .t{color:var(--red)}
ul{margin:0 0 14px;padding-left:20px}li{margin-bottom:6px}
.pill{display:inline-block;font-size:11.5px;font-weight:670;padding:3px 10px;border-radius:20px;margin-right:6px}
.pill.g{background:#E3F0E8;color:var(--green)}.pill.a{background:#FBF1D6;color:#8A6D18}.pill.r{background:#F8E2E2;color:var(--red)}
.foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--grey)}
.diagram{margin:18px 0;padding:14px;background:#fff;border:1px solid var(--border);border-radius:10px;overflow-x:auto}
.diagram svg{width:100%;height:auto;min-width:900px}
.cap{font-size:12.5px;color:var(--grey);font-style:italic;text-align:center;margin-top:6px}
@media(max-width:640px){.hero{padding:26px 22px}.hero h1{font-size:24px}}
</style>
